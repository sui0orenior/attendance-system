<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>学生管理</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .sort-link { text-decoration: none; color: white; }
        .sort-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
<div class="container mt-4">
    <h2 class="mb-4">📚 学生管理</h2>

    <!-- 提示消息 -->
    <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${successMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMsg}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${errorMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- 搜索栏和新增按钮 -->
    <div class="row mb-3">
        <div class="col-md-6">
            <form th:action="@{/student/list}" method="get" class="d-flex">
                <input type="text" name="keyword" class="form-control me-2"
                       placeholder="按姓名/学号搜索" th:value="${keyword}">
                <button type="submit" class="btn btn-outline-primary">搜索</button>
                <a th:href="@{/student/list}" class="btn btn-outline-secondary ms-2">重置</a>
            </form>
        </div>
        <div class="col-md-6 text-end">
            <a th:href="@{/student/add}" class="btn btn-primary">+ 新增学生</a>
        </div>
    </div>

    <!-- 学生表格 -->
    <div class="table-responsive">
        <table class="table table-striped table-hover table-bordered">
            <thead class="table-dark">
            <tr>
                <th width="50"><input type="checkbox" id="selectAll"></th>
                <th width="80">
                    <a th:href="@{/student/list(page=${currentPage}, sortBy='id', sortOrder=${sortBy == 'id' and sortOrder == 'asc' ? 'desc' : 'asc'}, keyword=${keyword})}"
                       class="sort-link">ID
                        <span th:if="${sortBy == 'id'}" th:text="${sortOrder == 'asc' ? '↑' : '↓'}"></span>
                    </a>
                </th>
                <th>
                    <a th:href="@{/student/list(page=${currentPage}, sortBy='studentNo', sortOrder=${sortBy == 'studentNo' and sortOrder == 'asc' ? 'desc' : 'asc'}, keyword=${keyword})}"
                       class="sort-link">学号
                        <span th:if="${sortBy == 'studentNo'}" th:text="${sortOrder == 'asc' ? '↑' : '↓'}"></span>
                    </a>
                </th>
                <th>
                    <a th:href="@{/student/list(page=${currentPage}, sortBy='name', sortOrder=${sortBy == 'name' and sortOrder == 'asc' ? 'desc' : 'asc'}, keyword=${keyword})}"
                       class="sort-link">姓名
                        <span th:if="${sortBy == 'name'}" th:text="${sortOrder == 'asc' ? '↑' : '↓'}"></span>
                    </a>
                </th>
                <th>班级</th>
                <th>性别</th>
                <th>电话</th>
                <th>邮箱</th>
                <th width="120">操作</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${students.empty}">
                <td colspan="9" class="text-center">暂无数据</td>
            </tr>
            <tr th:each="student : ${students}">
                <td class="text-center"><input type="checkbox" class="studentCheckbox" th:value="${student.id}"></td>
                <td th:text="${student.id}"></td>
                <td th:text="${student.studentNo}"></td>
                <td th:text="${student.name}"></td>
                <td th:text="${student.className}"></td>
                <td th:text="${student.gender}"></td>
                <td th:text="${student.phone}"></td>
                <td th:text="${student.email}"></td>
                <td>
                    <a th:href="@{/student/edit/{id}(id=${student.id})}" class="btn btn-sm btn-warning">编辑</a>
                    <a th:href="@{/student/delete/{id}(id=${student.id})}" class="btn btn-sm btn-danger"
                       onclick="return confirm('确定删除该学生吗？')">删除</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- 分页导航 -->
    <nav th:if="${totalPages > 0}">
        <ul class="pagination justify-content-center">
            <!-- 上一页 -->
            <li th:class="${currentPage == 0} ? 'page-item disabled' : 'page-item'">
                <a class="page-link" th:href="@{/student/list(page=${currentPage - 1}, keyword=${keyword}, sortBy=${sortBy}, sortOrder=${sortOrder})}">上一页</a>
            </li>

            <!-- 页码 -->
            <li th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                th:class="${currentPage == i} ? 'page-item active' : 'page-item'">
                <a class="page-link" th:href="@{/student/list(page=${i}, keyword=${keyword}, sortBy=${sortBy}, sortOrder=${sortOrder})}"
                   th:text="${i + 1}"></a>
            </li>

            <!-- 下一页 -->
            <li th:class="${currentPage >= totalPages - 1} ? 'page-item disabled' : 'page-item'">
                <a class="page-link" th:href="@{/student/list(page=${currentPage + 1}, keyword=${keyword}, sortBy=${sortBy}, sortOrder=${sortOrder})}">下一页</a>
            </li>
        </ul>
    </nav>

    <!-- 批量删除和返回按钮 -->
    <div class="mt-3 d-flex justify-content-between">
        <button id="batchDeleteBtn" class="btn btn-danger">🗑️ 删除选中</button>
        <a th:href="@{/}" class="btn btn-secondary">返回首页</a>
    </div>
</div>

<script>
    // 全选/全不选
    document.getElementById('selectAll').addEventListener('change', function() {
        document.querySelectorAll('.studentCheckbox').forEach(cb => cb.checked = this.checked);
    });

    // 批量删除
    document.getElementById('batchDeleteBtn').addEventListener('click', function() {
        let selected = [];
        document.querySelectorAll('.studentCheckbox:checked').forEach(cb => {
            selected.push(cb.value);
        });
        if (selected.length === 0) {
            alert('请至少选择一条数据');
            return;
        }
        if (confirm('确定删除选中的 ' + selected.length + ' 条数据吗？')) {
            window.location.href = '/student/batchDelete?ids=' + selected.join(',');
        }
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
