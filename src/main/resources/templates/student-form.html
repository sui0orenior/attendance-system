<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${title}">学生表单</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h3 class="mb-0" th:text="${title}">学生信息</h3>
                </div>
                <div class="card-body">
                    <!-- th:object 绑定后端对象，th:field 自动回显数据 -->
                    <form th:action="@{/student/save}" th:method="post" th:object="${student}" id="studentForm">
                        <!-- 隐藏ID字段，编辑时自动填充 -->
                        <input type="hidden" th:field="*{id}" />

                        <div class="mb-3">
                            <label class="form-label">学号 <span class="text-danger">*</span></label>
                            <input type="text" th:field="*{studentNo}" class="form-control"
                                   required pattern="[0-9]{8,20}" title="请输入8-20位数字">
                            <small class="text-muted">请输入8-20位数字</small>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">姓名 <span class="text-danger">*</span></label>
                            <input type="text" th:field="*{name}" class="form-control"
                                   required minlength="2" maxlength="20">
                            <small class="text-muted">请输入2-20个字符</small>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">班级</label>
                            <input type="text" th:field="*{className}" class="form-control"
                                   placeholder="例如：计算机1班">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">性别</label>
                            <select th:field="*{gender}" class="form-select">
                                <option value="">请选择</option>
                                <option value="男">男</option>
                                <option value="女">女</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">出生日期</label>
                            <input type="date" th:field="*{birthday}" class="form-control">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">电话</label>
                            <input type="tel" th:field="*{phone}" class="form-control"
                                   pattern="1[3-9]\d{9}" title="请输入11位手机号码">
                            <small class="text-muted">请输入11位手机号码</small>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">邮箱</label>
                            <input type="email" th:field="*{email}" class="form-control"
                                   pattern="[a-z0-9]+@[a-z0-9]+\.[a-z]{2,}" title="请输入正确的邮箱格式">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">地址</label>
                            <input type="text" th:field="*{address}" class="form-control">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">备注</label>
                            <textarea th:field="*{remark}" class="form-control" rows="3"
                                      maxlength="500"></textarea>
                            <small class="text-muted">最多500个字符</small>
                        </div>

                        <div class="text-center">
                            <button type="submit" class="btn btn-primary">保存</button>
                            <a th:href="@{/student/list}" class="btn btn-secondary">取消</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // 前端表单验证增强
    document.getElementById('studentForm').addEventListener('submit', function(e) {
        let studentNo = document.querySelector('[th\\:field="*{studentNo}"]') || document.getElementsByName('studentNo')[0];
        let phone = document.querySelector('[th\\:field="*{phone}"]') || document.getElementsByName('phone')[0];

        // 学号验证
        if (studentNo && studentNo.value) {
            let studentNoRegex = /^\d{8,20}$/;
            if (!studentNoRegex.test(studentNo.value)) {
                alert('学号必须是8-20位数字');
                e.preventDefault();
                return;
            }
        }

        // 手机号验证
        if (phone && phone.value) {
            let phoneRegex = /^1[3-9]\d{9}$/;
            if (!phoneRegex.test(phone.value)) {
                alert('请输入正确的11位手机号码');
                e.preventDefault();
                return;
            }
        }
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
