<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>用户注册</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <h2>用户注册</h2>

    <!-- 错误信息提示 -->
    <div th:if="${errorMsg}" class="alert alert-danger" th:text="${errorMsg}">错误信息</div>
    <!-- 成功信息提示 -->
    <div th:if="${successMsg}" class="alert alert-success" th:text="${successMsg}">成功信息</div>

    <form id="registerForm" th:action="@{/user/register}" method="post">
        <div class="form-group">
            <label for="username">用户名</label>
            <input type="text" id="username" name="username" placeholder="请输入用户名"
                   th:value="${username}" required>
            <div class="error-message" id="usernameError"></div>
        </div>

        <div class="form-group">
            <label for="realName">真实姓名</label>
            <input type="text" id="realName" name="realName" placeholder="请输入真实姓名"
                   th:value="${realName}">
        </div>

        <div class="form-group">
            <label for="email">邮箱</label>
            <input type="email" id="email" name="email" placeholder="请输入邮箱"
                   th:value="${email}">
        </div>

        <div class="form-group">
            <label for="phone">电话</label>
            <input type="text" id="phone" name="phone" placeholder="请输入电话"
                   th:value="${phone}">
        </div>

        <div class="form-group">
            <label for="password">密码</label>
            <input type="password" id="password" name="password" placeholder="请输入密码"
                   required minlength="6">
        </div>

        <div class="form-group">
            <label for="confirmPassword">确认密码</label>
            <input type="password" id="confirmPassword" name="confirmPassword"
                   placeholder="请再次输入密码" required minlength="6">
            <div class="error-message" id="confirmError">两次密码不一致</div>
        </div>

        <button type="submit" class="btn">注册</button>
    </form>

    <div class="link">
        已有账号？<a th:href="@{/login}">去登录</a>
    </div>
</div>

<!-- 简单前端验证 -->
<script th:src="@{/js/validate.js}"></script>
</body>
</html>
